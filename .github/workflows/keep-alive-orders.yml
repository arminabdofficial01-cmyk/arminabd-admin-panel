name: Supabase Keep-Alive

on:
  schedule:
    # Every 2 hours (UTC)
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  fetch-recent-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch recent orders from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node cron/fetch-recent-orders.mjs
